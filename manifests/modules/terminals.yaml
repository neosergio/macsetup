id: terminals
name: Terminals
description: A terminal app to replace Terminal.app
select: pick
default: [ghostty]
# Left out on purpose: alacritty, whose cask Homebrew has disabled (ticking it
# would fail the whole apply), and hyper, which adds little over the rest.
#
# wezterm's stable cask is the last tagged release, from early 2024; the
# project mostly ships nightlies now (wezterm@nightly). Stable is still the
# safer default for a menu like this.
packages:
  - {name: ghostty, cask: true, title: Ghostty}
  - {name: iterm2, cask: true, title: iTerm2}
  - {name: warp, cask: true, title: Warp}
  - {name: cmux, cask: true, title: cmux}       # built on Ghostty, for running agents side by side
  - {name: kitty, cask: true, title: kitty}
  - {name: wezterm, cask: true, title: WezTerm}
